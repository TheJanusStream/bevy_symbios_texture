[package]
name = "bevy_symbios_texture"
version = "0.12.0"
edition = "2024"
authors = ["Janus"]
description = "Algorithmic texture generator for Bevy."
license = "MIT"
readme = "README.md"
repository = "https://github.com/TheJanusStream/bevy_symbios_texture"
keywords = ["texture", "procedural", "generative", "simulation"]
categories = ["simulation", "game-development", "mathematics"]

# docs.rs builds every feature, so the egui config editors — the largest
# gated surface here, and the one an application embeds — are documented
# whether or not a default build carries them (symbios-overlands #1172,
# finding 10).
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
egui = ["dep:bevy_egui"]

[dependencies]
symbios-texture = "0.7"
bevy = "0.19"
bevy_egui = { version = "0.41", optional = true }
noise = "0.9"
# Default features off: nothing here asks for OS entropy. `rand::Rng` is the
# bound the genetics impls take, and the tests and the viewer example seed a
# `StdRng` (`std_rng`); `thread_rng`/`os_rng` would only hand every consumer a
# `getrandom` requirement on wasm (symbios-overlands #1172, finding 70).
rand = { version = "0.9", default-features = false, features = ["std", "std_rng"] }
rayon = "1.11"
serde = { version = "1.0", features = ["derive", "rc"] }
symbios-genetics = "0.2"

[dev-dependencies]
serde_json = "1.0"
criterion = "0.8"
bevy_egui = "0.41"

[[example]]
name = "texture_viewer"
required-features = ["egui"]

[[example]]
name = "procedural_material"

[[example]]
name = "animated_rust"

[[bench]]
name = "bench_main"
harness = false

[lints.rust]
# Set by docs.rs only; see the attribute at the top of `src/lib.rs`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[profile.bench]
debug = true
